# Render Configuration
# Place this in repo root for Infrastructure as Code deployment

services:
  # Unified API Service (API Gateway + Gmail Service merged)
  - type: web
    name: credit-card-api
    runtime: node
    region: singapore
    plan: free
    branch: prod
    rootDir: backend/services/api-gateway
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # Add all other environment variables in Render Dashboard
      # See backend/services/api-gateway/.env.production.example

      # Note: Gmail service is now integrated into the main API
      # No separate gmail-service deployment needed
