name: Test & Coverage

on:
    push:
        branches: [dev-v1, prod]
    pull_request:
        branches: [dev-v1, prod]

jobs:
    backend-tests:
        name: Backend Tests & Coverage
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run typecheck

            - name: Run tests with coverage
              run: npm run test:ci
              env:
                  NODE_ENV: test
                  JWT_SECRET: test-secret-key-for-ci
                  SUPABASE_URL: https://test.supabase.co
                  SUPABASE_ANON_KEY: test-anon-key
                  REDIS_URL: redis://localhost:6379

            - name: Check coverage thresholds
              run: |
                  COVERAGE=$(cat services/api-gateway/coverage/coverage-summary.json | jq '.total.lines.pct')
                  echo "Coverage: $COVERAGE%"
                  if (( $(echo "$COVERAGE < 80" | bc -l) )); then
                    echo "❌ Coverage is below 80% threshold"
                    exit 1
                  fi
                  echo "✅ Coverage meets 80% threshold"

            - name: Upload coverage reports
              uses: codecov/codecov-action@v4
              with:
                  files: ./backend/services/api-gateway/coverage/lcov.info
                  flags: backend
                  name: backend-coverage
                  fail_ci_if_error: false

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/services/api-gateway/coverage/

    frontend-tests:
        name: Frontend Tests & Coverage
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run type-check

            - name: Run tests with coverage
              run: npm run test:ci
              env:
                  NODE_ENV: test
                  NEXT_PUBLIC_API_URL: http://localhost:3001/api

            - name: Check coverage thresholds
              run: |
                  COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
                  echo "Coverage: $COVERAGE%"
                  if (( $(echo "$COVERAGE < 70" | bc -l) )); then
                    echo "❌ Coverage is below 70% threshold"
                    exit 1
                  fi
                  echo "✅ Coverage meets 70% threshold"

            - name: Upload coverage reports
              uses: codecov/codecov-action@v4
              with:
                  files: ./frontend/coverage/lcov.info
                  flags: frontend
                  name: frontend-coverage
                  fail_ci_if_error: false

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/

    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-latest
        needs: [backend-tests]

        defaults:
            run:
                working-directory: ./backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run integration tests
              run: cd services/api-gateway && npx jest --testMatch='**/*.integration.spec.ts' --ci
              env:
                  NODE_ENV: test
                  JWT_SECRET: test-secret
                  SUPABASE_URL: https://test.supabase.co
                  SUPABASE_ANON_KEY: test-key

    e2e-tests:
        name: E2E Tests (Playwright)
        runs-on: ubuntu-latest
        needs: [frontend-tests]

        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Build Next.js app
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:3001/api

            - name: Start Next.js app
              run: npm start &
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:3001/api

            - name: Wait for app to be ready
              run: |
                  echo "Waiting for app to start..."
                  npx wait-on http://localhost:3000 --timeout 60000

            - name: Run Playwright tests
              run: npm run e2e
              env:
                  PLAYWRIGHT_BASE_URL: http://localhost:3000

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: frontend/playwright-report/
                  retention-days: 7

    coverage-summary:
        name: Coverage Summary
        runs-on: ubuntu-latest
        needs: [backend-tests, frontend-tests]
        if: always()

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download backend coverage
              uses: actions/download-artifact@v4
              with:
                  name: backend-coverage
                  path: ./backend-coverage

            - name: Download frontend coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-coverage
                  path: ./frontend-coverage

            - name: Generate coverage summary
              run: |
                  echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Backend Coverage" >> $GITHUB_STEP_SUMMARY
                  if [ -f backend-coverage/coverage-summary.json ]; then
                    BACKEND_LINES=$(cat backend-coverage/coverage-summary.json | jq '.total.lines.pct')
                    BACKEND_BRANCHES=$(cat backend-coverage/coverage-summary.json | jq '.total.branches.pct')
                    BACKEND_FUNCTIONS=$(cat backend-coverage/coverage-summary.json | jq '.total.functions.pct')
                    echo "- Lines: ${BACKEND_LINES}%" >> $GITHUB_STEP_SUMMARY
                    echo "- Branches: ${BACKEND_BRANCHES}%" >> $GITHUB_STEP_SUMMARY
                    echo "- Functions: ${BACKEND_FUNCTIONS}%" >> $GITHUB_STEP_SUMMARY
                  fi
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
                  if [ -f frontend-coverage/coverage-summary.json ]; then
                    FRONTEND_LINES=$(cat frontend-coverage/coverage-summary.json | jq '.total.lines.pct')
                    FRONTEND_BRANCHES=$(cat frontend-coverage/coverage-summary.json | jq '.total.branches.pct')
                    FRONTEND_FUNCTIONS=$(cat frontend-coverage/coverage-summary.json | jq '.total.functions.pct')
                    echo "- Lines: ${FRONTEND_LINES}%" >> $GITHUB_STEP_SUMMARY
                    echo "- Branches: ${FRONTEND_BRANCHES}%" >> $GITHUB_STEP_SUMMARY
                    echo "- Functions: ${FRONTEND_FUNCTIONS}%" >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Comment PR with coverage
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      let comment = '## 📊 Test Coverage Report\n\n';

                      if (fs.existsSync('backend-coverage/coverage-summary.json')) {
                        const backend = JSON.parse(fs.readFileSync('backend-coverage/coverage-summary.json'));
                        comment += '### Backend\n';
                        comment += `- **Lines:** ${backend.total.lines.pct}%\n`;
                        comment += `- **Branches:** ${backend.total.branches.pct}%\n`;
                        comment += `- **Functions:** ${backend.total.functions.pct}%\n\n`;
                      }

                      if (fs.existsSync('frontend-coverage/coverage-summary.json')) {
                        const frontend = JSON.parse(fs.readFileSync('frontend-coverage/coverage-summary.json'));
                        comment += '### Frontend\n';
                        comment += `- **Lines:** ${frontend.total.lines.pct}%\n`;
                        comment += `- **Branches:** ${frontend.total.branches.pct}%\n`;
                        comment += `- **Functions:** ${frontend.total.functions.pct}%\n\n`;
                      }

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
