name: Backend CI/CD

# This workflow runs tests on push/PR
# Deployment is handled automatically by Render (see render.yaml)
# This aligns with the zero-cost architecture (Render + Vercel)

on:
  push:
    branches: [prod, dev-v1, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [prod, dev-v1, develop]
    paths:
      - "backend/**"

jobs:
  test:
    name: Test Backend Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install shared dependencies
        working-directory: ./backend/shared
        run: npm ci

      - name: Install API Gateway dependencies
        working-directory: ./backend/services/api-gateway
        run: npm ci

      - name: Build shared module
        working-directory: ./backend/shared
        run: npm run build

      - name: Run linter
        working-directory: ./backend/services/api-gateway
        run: npm run lint
        continue-on-error: true

      - name: Run type check
        working-directory: ./backend/services/api-gateway
        run: npm run type-check

      - name: Run tests
        working-directory: ./backend/services/api-gateway
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/services/api-gateway/coverage/lcov.info
          flags: backend
        continue-on-error: true

  build-check:
    name: Build Check
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: |
          npm ci
          cd shared && npm ci && cd ..
          cd services/api-gateway && npm ci

      - name: Build application
        working-directory: ./backend
        run: |
          npm run build --workspace=shared
          npm run build --workspace=api-gateway

      - name: Test start command
        working-directory: ./backend/services/api-gateway
        run: |
          # Verify the built files exist
          ls -la dist/
          echo "✅ Build successful"

  # Note: Deployment is handled by Render
  # When you push to your branch, Render automatically:
  # 1. Detects the push via GitHub webhook
  # 2. Runs the build command from render.yaml
  # 3. Deploys to your free tier instance
  # 4. No secrets or manual configuration needed in GitHub Actions
