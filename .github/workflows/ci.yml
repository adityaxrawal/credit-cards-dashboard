name: CI/CD Pipeline

on:
    push:
        branches:
            - dev-v1
            - prod
    pull_request:
        branches:
            - dev-v1
            - prod

env:
    NODE_VERSION: "18.x"

jobs:
    # ============================================================================
    # Backend CI
    # ============================================================================
    backend-ci:
        name: Backend - Lint, Build, Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend/services/api-gateway

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"
                  cache-dependency-path: "./backend/services/api-gateway/package-lock.json"

            - name: Install shared dependencies
              run: |
                  cd ../shared
                  npm ci

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck || true

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test -- --coverage --watchAll=false

            - name: Check coverage threshold
              run: |
                  COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
                  echo "Coverage: $COVERAGE%"
                  if (( $(echo "$COVERAGE < 80" | bc -l) )); then
                    echo "❌ Coverage $COVERAGE% is below 80% threshold"
                    exit 1
                  fi
                  echo "✅ Coverage $COVERAGE% meets 80% threshold"

            - name: Upload coverage reports
              uses: codecov/codecov-action@v3
              with:
                  files: ./backend/services/api-gateway/coverage/coverage-final.json
                  flags: backend
                  name: backend-coverage

    # ============================================================================
    # Frontend CI
    # ============================================================================
    frontend-ci:
        name: Frontend - Lint, Build, Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"
                  cache-dependency-path: "./frontend/package-lock.json"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check || npx tsc --noEmit

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:3001
                  NEXT_PUBLIC_ENVIRONMENT: test

            - name: Run tests
              run: npm test -- --coverage --watchAll=false

            - name: Check coverage threshold
              run: |
                  COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
                  echo "Coverage: $COVERAGE%"
                  if (( $(echo "$COVERAGE < 70" | bc -l) )); then
                    echo "❌ Coverage $COVERAGE% is below 70% threshold"
                    exit 1
                  fi
                  echo "✅ Coverage $COVERAGE% meets 70% threshold"

            - name: Upload coverage reports
              uses: codecov/codecov-action@v3
              with:
                  files: ./frontend/coverage/coverage-final.json
                  flags: frontend
                  name: frontend-coverage

    # ============================================================================
    # Database Migrations Check
    # ============================================================================
    database-check:
        name: Database - Validate Migrations
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./database

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install dependencies
              run: npm ci

            - name: Validate SQL syntax
              run: |
                  for file in migrations/*.sql; do
                    echo "Checking $file..."
                    # Basic SQL syntax validation (check for common errors)
                    if grep -qi "syntax error" "$file"; then
                      echo "❌ Syntax error found in $file"
                      exit 1
                    fi
                  done
                  echo "✅ All migration files validated"

    # ============================================================================
    # Security Audit
    # ============================================================================
    security-audit:
        name: Security - Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Audit backend dependencies
              run: |
                  cd backend/services/api-gateway
                  npm audit --audit-level=moderate || true

            - name: Audit frontend dependencies
              run: |
                  cd frontend
                  npm audit --audit-level=moderate || true

    # ============================================================================
    # Deploy Backend (Render)
    # ============================================================================
    deploy-backend:
        name: Deploy Backend to Render
        runs-on: ubuntu-latest
        needs: [backend-ci, database-check, security-audit]
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Trigger Render deployment
              run: |
                  curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "branch": "prod",
                      "clear_cache": false
                    }'
                  echo "✅ Render deployment triggered"

            - name: Wait for deployment
              run: |
                  echo "⏳ Waiting for deployment to complete..."
                  sleep 60

            - name: Health check
              run: |
                  HEALTH_URL="${{ secrets.BACKEND_URL }}/api/admin/health"
                  echo "Checking health at $HEALTH_URL"

                  for i in {1..10}; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")
                    if [ "$STATUS" -eq 200 ]; then
                      echo "✅ Backend is healthy (HTTP $STATUS)"
                      exit 0
                    fi
                    echo "⏳ Attempt $i/10: Backend returned HTTP $STATUS, retrying..."
                    sleep 30
                  done

                  echo "❌ Backend health check failed after 10 attempts"
                  exit 1

    # ============================================================================
    # Deploy Frontend (Vercel)
    # ============================================================================
    deploy-frontend:
        name: Deploy Frontend to Vercel
        runs-on: ubuntu-latest
        needs: [frontend-ci, deploy-backend]
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v25
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  vercel-args: "--prod"
                  working-directory: ./frontend

            - name: Health check
              run: |
                  FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
                  echo "Checking frontend at $FRONTEND_URL"

                  for i in {1..5}; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
                    if [ "$STATUS" -eq 200 ]; then
                      echo "✅ Frontend is healthy (HTTP $STATUS)"
                      exit 0
                    fi
                    echo "⏳ Attempt $i/5: Frontend returned HTTP $STATUS, retrying..."
                    sleep 20
                  done

                  echo "❌ Frontend health check failed after 5 attempts"
                  exit 1

    # ============================================================================
    # Post-Deployment Tests
    # ============================================================================
    e2e-tests:
        name: E2E Tests (Production)
        runs-on: ubuntu-latest
        needs: [deploy-frontend]
        if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Install Playwright
              working-directory: ./frontend
              run: npx playwright install --with-deps

            - name: Run E2E tests
              working-directory: ./frontend
              env:
                  PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.FRONTEND_URL }}
              run: npm run test:e2e

            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@v3
              with:
                  name: playwright-report
                  path: frontend/playwright-report/

    # ============================================================================
    # Notification
    # ============================================================================
    notify:
        name: Send Deployment Notification
        runs-on: ubuntu-latest
        needs: [deploy-backend, deploy-frontend, e2e-tests]
        if: always() && github.ref == 'refs/heads/prod'

        steps:
            - name: Notify success
              if: needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
              run: |
                  echo "✅ Deployment successful!"
                  echo "Backend: ${{ secrets.BACKEND_URL }}"
                  echo "Frontend: ${{ secrets.FRONTEND_URL }}"

            - name: Notify failure
              if: needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure'
              run: |
                  echo "❌ Deployment failed!"
                  exit 1
